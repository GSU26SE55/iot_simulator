# Seed cho IoT Simulator.
#
# ⚠ ĐÂY CHỈ LÀ ĐƯỜNG LUI — vai trò giống `firmware-esp32/include/config.h` bên repo `iot`.
#   Từ khi simulator đọc đủ provision response, NGUỒN CHÂN LÝ của các giá trị dưới đây là BACKEND:
#     · pollingIntervalSeconds / heartbeatIntervalSeconds / siteId / ntpServer
#     · 6 trường MQTT (host, port, tls, topicPrefix, username, password)   ← IOT3-42
#     · batteryMappings[] (serial ↔ unitId ↔ sensorSourceCode)             ← IOT3-49
#   Chúng được lưu bền vững ở `logs/state/<device_code>.nvs.json` (tương đương NVS của ESP32) và
#   ghi đè seed ngay khi có. Muốn quay về trạng thái "thiết bị mới bóc hộp":
#       python -m src.main --clear-state
#
#   Seed ở đây dùng cho: lần chạy ĐẦU TIÊN (chưa provision), và bảng pin dự phòng khi backend
#   không trả `batteryMappings[]`.
#
# Site A: Solar Farm Long An  (b6d83be5-050c-47a0-9f73-3160f517be80) → BAT-001/002/003/004
# Site B: Solar Farm Da Nang  (0bbfff66-2697-4205-bddc-5593b457d7bc) → BAT-005/007
# Không thuộc site nào: BAT-006 · BAT-008/009 (test scope Customer)

backend:
  base_url: http://localhost:4001         # ApiGateway
  tls_verify: false

  # ⚠ `iot2-production` là contract DUY NHẤT mà firmware ESP32 thật chạy, và là contract có ĐỦ
  #   tính năng: provision, heartbeat, MQTT, ambient, environmental-incident, OTA, Idempotency-Key.
  #   Đổi về `current` nếu backend của bạn còn là bản Sprint 1 (chỉ có POST /api/sensor-readings
  #   /batch với items[].batteryAssetId Guid) — khi đó mọi tính năng trên tự TẮT.
  contract_version: iot2-production

  heartbeat_interval_s: 60                # đường lui; provision response sẽ ghi đè
  ingest_interval_s: 5                    # đường lui; provision response sẽ ghi đè
  batch_size_per_battery: 3               # BMS + INA226 + DS18B20
  http_timeout_s: 15

  # Backoff — khớp `net/backoff.h`: base 2s, trần 5 phút, jitter ±20%.
  retry_base_s: 2
  retry_max_s: 300
  retry_jitter_pct: 20

  # OTA — khớp `include/config.h` (S7-FW-01/02).
  ota_enabled: true
  ota_check_interval_s: 3600              # OTA_CHECK_INTERVAL_MS  = 1h
  ota_warmup_s: 30                        # chờ mạng/giờ/provision ổn định sau boot
  ota_health_timeout_s: 120               # OTA_HEALTH_TIMEOUT_MS  = 2' rồi rollback
  ota_download_timeout_s: 20              # OTA_HTTP_TIMEOUT_MS
  ota_max_boot_attempts: 5                # OTA_MAX_BOOT_ATTEMPTS
  ota_max_version_fails: 3                # OTA_MAX_VERSION_FAILS

  # IOT3-49 — dùng `batteryMappings[]` backend trả về làm nguồn chân lý cho tập pin.
  # Đặt false CHỈ khi đang gỡ rối và muốn ép dùng bảng pin trong seed.
  apply_battery_map: true

mqtt:
  # Bật để chạy đường MQTT-first (S4-FW-04).
  #
  # ⚠ Theo THIẾT KẾ (IOT3-42), `/provision` cấp đủ 6 trường lúc chạy và bạn không cần điền gì ở
  #   đây. NHƯNG đã đo ngày 2026-08-11: **backend đang deploy KHÔNG trả trường `mqtt*` nào**, và
  #   `iot_devices.mqtt_username` của ESP32-SIM-001/002 vẫn rỗng ⇒ simulator chạy HTTPS-only.
  #   Muốn demo MQTT ngay thì điền tay các giá trị dưới (broker EMQX ở cổng 11883 cho phép
  #   anonymous). Chi tiết + cách kiểm chứng: guideline.md §13.1–13.2.
  enabled: false
  host: localhost
  port: 21883                             # solar-mosquitto map 21883:1883
  tls: false
  username: ""
  password: ""

  # GỐC topic. Tiền tố đầy đủ = "<gốc>/<mã thiết bị chữ thường>", khớp
  # `MqttBrokerEndpointProvider.TopicPrefixFor()` của backend và ACL `solar/%u/...` của Mosquitto.
  topic_prefix: solar

  # ⚠ QoS 0 là CỐ Ý: firmware dùng PubSubClient v2.8, thư viện KHÔNG hỗ trợ publish QoS 1
  #   (xem audit `iot/iot-backend-contract-gaps.md` #4). Để 1 thì simulator "khoẻ hơn" thiết bị
  #   thật và che mất lớp lỗi rơi message trên mạng chập chờn.
  qos: 0

  keepalive_s: 30                         # MQTT_KEEPALIVE_SEC
  max_packet_size: 4096                   # MQTT_MAX_PACKET_SIZE
  reconnect_interval_s: 5                 # MQTT_RECONNECT_INTERVAL_MS
  auth_fail_threshold: 5                  # kAuthFailThreshold (IOT3-44)
  publish_fail_threshold: 3               # MQTT_PUBLISH_FAIL_THRESHOLD (S4-FW-06)

# Ghi state ra đĩa (provision, credential MQTT, bảng pin, trạng thái OTA).
# false = mỗi lần chạy là một thiết bị mới tinh (provision lại từ đầu).
persist_state: true

# ─────────────────────────────────────────────────────────────────────────────────────────────
# DANH MỤC PIN DÙNG CHUNG — tra khi backend giao một serial không có trong devices[].batteries
#
# Vì sao CẦN: `POST /provision` trả `batteryMappings[]` gồm MỌI pin cùng site với thiết bị
# (#IoT2-18: thiết bị chỉ được ingest cho pin CÙNG SITE). Với ESP32-SIM-001 ở Solar Farm Long An,
# backend giao cả pin NMC 48V và LiFePO4 24V. Không khai loại pin ở đây thì simulator dựng mô
# hình mặc định 12,8V cho chúng ⇒ backend chấm **Undervoltage Critical** liên tục vì ngưỡng NMC
# là 42–54,6V. Cảnh báo giả, và rất khó truy nếu không biết chỗ này.
#
# Giá trị dưới lấy đúng từ `battery_assets` + `threshold_configs` của backend.
