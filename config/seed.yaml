# ─── Danh sách scenario (đặt ở `scenario:` của thiết bị, hoặc CLI --scenario, hoặc lệnh MQTT
#     `set_scenario` lúc đang chạy) ───
#
#   Pin (BMS):        normal · overheat · overvoltage · undervoltage · low_soc · rapid_discharge
#                     abnormal_charging · soh_degradation · bms_error
#   Cross-source:     sensor_mismatch          (INA226 lệch >0.5V, DS18B20 lệch >5°C)
#   Môi trường:       high_ambient_temp · high_humidity · high_temp_humidity_combo
#   Sự cố an toàn:    gas_leak · smoke         → EnvironmentalIncident type=GasLeak(3)
#                     water_leak               → type=Flood(4)
#                     fire_detected            → type=FireDetected(2)  ⚠ mở rộng RIÊNG của
#                                                simulator, firmware KHÔNG có đường báo cháy
#   Vận hành:         device_offline (dừng sau 60s để demo LWT) · clock_skew (+10 phút, #IoT2-15)
#
# ⚠ `smoke` và `gas_leak` đều cho ra `GasLeak (3)`: MQ-2 bản chất là cảm biến GAS, và firmware
#   ánh xạ nó thành GasLeak (quyết định NS-24 #664). `Smoke (1)` dành cho cảm biến khói quang học.
