# Seed data cho IoT Simulator — KHỚP backend DB thật (cập nhật 2026-06-29)
#   Site: Solar Farm Long An (33643b28-f739-4701-beec-cc84c77a5584)
#   Customer: Tri Tran (3cb8215b-e460-496d-85be-4115a8755edb)
#   4 pin thật trong DB:
#     BAT-2026-001 06f48ef8-688b-487f-ad3a-ca78bca06a61  LiFePO4 12V 100Ah
#     BAT-2026-002 9580fbce-2d9d-40d0-9ecf-fc20cd22d09b  LiFePO4 12V 100Ah
#     BAT-2026-003 9caf9947-df90-4b6e-873b-b65c1e544949  NMC 48V 200Ah
#     BAT-2026-004 501cb9a5-912c-4d12-8026-eff840fc1749  NMC 48V 200Ah
#   2 device per-device key (provision lại bằng scripts/provision_devices.py):
#     ESP32-SIM-001 → BAT-001/002 (LiFePO4)
#     ESP32-SIM-002 → BAT-003/004 (NMC)
#   → test được: asset · assets · customer · site · all
#   (Bản gốc 9-pin lưu tại config/seed.yaml.bak)

backend:
  base_url: http://localhost:4001         # ApiGateway (HTTP, không phải HTTPS)
  tls_verify: false
  contract_version: current               # backend hôm nay (items[].batteryAssetId Guid)
  heartbeat_interval_s: 60
  ingest_interval_s: 5
  batch_size_per_battery: 1               # 1 reading/pin/batch khớp firmware Sprint 1
  retry_base_s: 2
  retry_max_s: 300
  retry_jitter_pct: 20

mqtt:
  enabled: false                          # Sprint IoT-2 Phase D — tạm tắt
  host: localhost
  port: 21883                             # solar-mosquitto map 21883:1883
  tls: false
  topic_prefix: solar
  qos: 1

devices:
  # ─── Device 1: 2 pin LiFePO4 12V — mỗi pin 1 scenario riêng (xem `scenario:` từng pin) ───
  - device_code: ESP32-SIM-001
    site_id_guid: 33643b28-f739-4701-beec-cc84c77a5584
    site_label: solar-farm-long-an
    firmware_version: 1.0.0-sim
    hardware_revision: ESP32-S3-DevKitC-1-N16R8
    model: ESP32-WROOM-S3
    api_key: iotk_oDmOJ8dAhp52MPLJA-jhXCdZU6Yn3Vyp8Dsh5tP1dmQ
    batteries:
      - serial: BAT-2026-001            # Case 1: PIN KHỎE — SOH cao, không sự cố
        battery_asset_id: 06f48ef8-688b-487f-ad3a-ca78bca06a61
        unit_id: 1
        nominal_voltage: 12.8
        nominal_capacity_ah: 100
        initial_soc: 30.0
        initial_soh: 94.2
        cycle_count: 120
        chemistry: LiFePO4
        scenario: normal
      - serial: BAT-2026-002            # Case 2: SUY GIẢM SOH — SOH tụt dần → AI Degrading/Failed
        battery_asset_id: 9580fbce-2d9d-40d0-9ecf-fc20cd22d09b
        unit_id: 2
        nominal_voltage: 12.8
        nominal_capacity_ah: 100
        initial_soc: 25.0
        initial_soh: 88.0
        cycle_count: 245
        chemistry: LiFePO4
        scenario: soh_degradation
    sensors:
      ina226: true
      ds18b20: true
      sht31: true
      mq2: true
      water_leak: true
    scenario: normal
    sensor_drift:
      voltage_v: 0.05
      temperature_c: 1.2

  # ─── Device 2: 2 pin NMC 48V 200Ah — mỗi pin 1 scenario riêng (xem `scenario:` từng pin) ───
  - device_code: ESP32-SIM-002
    site_id_guid: 33643b28-f739-4701-beec-cc84c77a5584
    site_label: solar-farm-long-an
    firmware_version: 1.0.0-sim
    hardware_revision: ESP32-S3-DevKitC-1-N16R8
    model: ESP32-WROOM-S3
    api_key: iotk_oYM7G6NagCDCuE6eG7ZvWzJuy6hMJQP3A_QeN8_IX3g
    batteries:
      - serial: BAT-2026-003            # Case 3: QUÁ NHIỆT — nhiệt độ vượt ngưỡng → alert nhiệt + ticket
        battery_asset_id: 9caf9947-df90-4b6e-873b-b65c1e544949
        unit_id: 1
        nominal_voltage: 48.0
        nominal_capacity_ah: 200
        initial_soc: 55.0
        initial_soh: 82.0
        cycle_count: 1850
        chemistry: NMC
        scenario: overheat
      - serial: BAT-2026-004            # Case 4: SỤT ÁP — điện áp tụt dưới ngưỡng → alert undervoltage
        battery_asset_id: 501cb9a5-912c-4d12-8026-eff840fc1749
        unit_id: 2
        nominal_voltage: 48.0
        nominal_capacity_ah: 200
        initial_soc: 65.0
        initial_soh: 90.0
        cycle_count: 200
        chemistry: NMC
        scenario: undervoltage
    sensors:
      ina226: true
      ds18b20: true
      sht31: false
      mq2: false
      water_leak: false
    scenario: normal
    sensor_drift:
      voltage_v: 0.08
      temperature_c: 0.8

# ─── Scenario reference (đổi bằng `scenario:` trên device, hoặc CLI --scenario) ───
# normal | overheat | overvoltage | undervoltage | low_soc | rapid_discharge | abnormal_charging
# device_offline | soh_degradation | high_ambient_temp | high_humidity | high_temp_humidity_combo
# sensor_mismatch | smoke | fire_detected | gas_leak | water_leak | bms_error | clock_skew
