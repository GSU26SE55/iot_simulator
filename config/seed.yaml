# Seed data cho IoT Simulator — sinh từ thực tế DB backend lúc 2026-06-13
#   Site:      Solar Farm Long An (b6d83be5-050c-47a0-9f73-3160f517be80)
#   3 pin:     BAT-2026-001 / 002 / 003 (đã có sẵn trong DB)
#   2 device:  ESP32-SIM-001 + ESP32-SIM-002 (vừa provision qua /api/admin/iot-devices)

backend:
  base_url: http://localhost:4001         # ApiGateway (HTTP, không phải HTTPS)
  tls_verify: false
  contract_version: current               # backend hôm nay (items[].batteryAssetId Guid)
  heartbeat_interval_s: 60
  # Sprint 1 spec (tasksprint S1-FW-07): "Loop chính mỗi 5s ... posted 4 readings (200 OK)"
  ingest_interval_s: 5
  batch_size_per_battery: 1               # 1 reading/pin/batch khớp firmware Sprint 1
  retry_base_s: 2
  retry_max_s: 300
  retry_jitter_pct: 20

mqtt:
  enabled: false                          # Sprint IoT-2 Phase D — tạm tắt
  host: localhost
  port: 21883                             # solar-mosquitto map 21883:1883
  tls: false
  topic_prefix: solar
  qos: 1

devices:
  # ─── Device 1: 2 pin LiFePO4 12V — scenario normal ───
  - device_code: ESP32-SIM-001
    site_id_guid: b6d83be5-050c-47a0-9f73-3160f517be80
    site_label: solar-farm-long-an
    firmware_version: 1.0.0-sim
    hardware_revision: ESP32-S3-DevKitC-1-N16R8
    model: ESP32-WROOM-S3
    api_key: iotk_p-MbplnKWR1VjEVRgbsFMIeTWZsnhx5e86PNNiEkstU
    batteries:
      # Sprint 1 spec (tasksprint S1-FW-04): "voltage 12.0–13.0V, dao động sine".
      # SOC 25-30% giữ OCV(SOC) trong dải 12.0-13.0V trên LiFePO4 OCV curve.
      - serial: BAT-2026-001
        battery_asset_id: 54754d04-3c44-4a49-acf2-068cfde936bc
        unit_id: 1
        nominal_voltage: 12.8
        nominal_capacity_ah: 100
        initial_soc: 30.0
        initial_soh: 94.2
        cycle_count: 120
        chemistry: LiFePO4
      - serial: BAT-2026-002
        battery_asset_id: 2810f7d9-a11e-4ab0-85d0-d4e68cce8443
        unit_id: 2
        nominal_voltage: 12.8
        nominal_capacity_ah: 100
        initial_soc: 25.0
        initial_soh: 88.0
        cycle_count: 245
        chemistry: LiFePO4
    sensors:
      ina226: true
      ds18b20: true
      sht31: true
      mq2: true
      water_leak: true
    scenario: normal
    sensor_drift:
      voltage_v: 0.05
      temperature_c: 1.2

  # ─── Device 2: 1 pin NMC 48V 200Ah — scenario low_soc (demo P2 alert) ───
  - device_code: ESP32-SIM-002
    site_id_guid: b6d83be5-050c-47a0-9f73-3160f517be80
    site_label: solar-farm-long-an
    firmware_version: 1.0.0-sim
    hardware_revision: ESP32-S3-DevKitC-1-N16R8
    model: ESP32-WROOM-S3
    api_key: iotk_FkqcRl_SwNAFSSMWBptEn9_ikXbV8tLZdxyjfuaMqmI
    batteries:
      - serial: BAT-2026-003
        battery_asset_id: 5e2116ec-4d54-4bc6-a2e8-543a86c48934
        unit_id: 1
        nominal_voltage: 48.0
        nominal_capacity_ah: 200
        initial_soc: 55.0
        initial_soh: 82.0
        cycle_count: 1850
        chemistry: NMC
    sensors:
      ina226: true
      ds18b20: true
      sht31: false
      mq2: false
      water_leak: false
    scenario: low_soc
    sensor_drift:
      voltage_v: 0.08
      temperature_c: 0.8

# ─── Scenario reference (đổi bằng `scenario:` trên device, hoặc CLI --scenario) ───
# normal | overheat | overvoltage | undervoltage | low_soc | rapid_discharge | abnormal_charging
# device_offline | soh_degradation | high_ambient_temp | high_humidity | high_temp_humidity_combo
# sensor_mismatch | smoke | fire_detected | gas_leak | water_leak | bms_error | clock_skew
